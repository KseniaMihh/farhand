name: CI

# Nothing reaches master unverified, and every pull request is checked before
# it can be merged.
#
# Feature branches are covered through their pull request rather than by a
# second `push` trigger: with both, every push to a branch that already has a
# PR open would start two identical runs. The project's workflow
# (docs/13-workflow.md) opens a PR for every change, so nothing slips through.
on:
  push:
    branches: [master]
  pull_request:

# Only the newest run per branch matters. Pushing a fix ten seconds after
# spotting a mistake cancels the run that was already doomed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. This workflow builds and tests; it never writes to the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    # npm and Prisma run inside farhand-api, exactly as they do locally.
    defaults:
      run:
        working-directory: farhand-api

    services:
      # The same image as docker-compose.yml, so a failure here is a real
      # failure rather than a version difference.
      #
      # POSTGRES_DB is farhand_test, not farhand: CI has no development data to
      # keep separate, so the one database it needs is the test one. That name
      # also satisfies the guard in tests/setup/truncate.ts, which refuses to
      # truncate a database whose name does not end in "_test".
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: farhand
          POSTGRES_PASSWORD: farhand
          POSTGRES_DB: farhand_test
        ports:
          - 5432:5432
        # Without this the job races the database and fails intermittently on a
        # cold runner — the container is "started" well before Postgres is
        # accepting connections.
        options: >-
          --health-cmd "pg_isready -U farhand -d farhand_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The same local file store as docker-compose.yml, with the same
      # throwaway credentials, which .env.test already names. No health check:
      # the image has no tool to run one with, so tests/setup/global-setup.ts
      # waits for it instead.
      storage:
        image: andrewgaul/s3proxy:latest
        env:
          S3PROXY_AUTHORIZATION: aws-v2-or-v4
          S3PROXY_IDENTITY: farhand-local
          S3PROXY_CREDENTIAL: farhand-local-secret
          JCLOUDS_PROVIDER: filesystem
          JCLOUDS_FILESYSTEM_BASEDIR: /tmp
        ports:
          - 9000:80

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches local development. Bump both together.
          node-version: "24"
          cache: npm
          # setup-node looks for a lockfile at the repository root by default,
          # and ours is one level down.
          cache-dependency-path: farhand-api/package-lock.json

      # `ci` rather than `install`: it installs exactly what the lockfile says
      # and fails if package.json and the lockfile disagree, instead of quietly
      # resolving newer versions that were never tested.
      - name: Install dependencies
        run: npm ci

      # prisma.config.ts resolves DATABASE_URL through Prisma's env() helper,
      # which throws if the variable is missing — and it is missing here, because
      # .env is gitignored and only exists on a developer's machine. Step 1 of
      # the README's setup is copying an env file into place; this is CI doing
      # the same thing.
      #
      # .env.test rather than .env.example, because the only database CI has is
      # the test one. Copying the file instead of setting DATABASE_URL in this
      # workflow keeps the connection string in exactly one place.
      - name: Put the test environment in place
        run: cp .env.test .env

      # The Prisma client is generated code, not committed. Everything after
      # this step needs it: the type-aware lint rules and the typecheck read its
      # types, and the tests call it.
      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Migrations are applied by tests/setup/global-setup.ts, which runs
      # `prisma migrate deploy` before the suite. Deliberately not repeated as a
      # step here: CI then runs the same command you run locally, and there is
      # one place that decides how a test database is prepared.
      #
      # The connection details come from the committed .env.test, which points
      # at localhost:5432 — the port the service container above is mapped to.
      - name: Test
        run: npm test

      # The half of #109 that nothing inside the suite can see. global-setup.ts
      # empties the file store before the suite and again after it; a test
      # proves the first, and nothing running inside the suite can prove the
      # second, because it happens after the last test. So it is checked from
      # out here instead, where the answer is known.
      - name: The suite leaves the file store empty
        run: npm run test:store-empty

  image:
    name: Build the image and run the stack
    runs-on: ubuntu-latest

    # A Dockerfile nobody builds is a Dockerfile that is broken and does not
    # know it yet. This job builds it on every pull request and then proves the
    # three things that are easy to get wrong and invisible until deployment:
    # the stack comes up, the API answers when the database is behind it, and
    # the process is not running as root.
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the image and start the stack
        # --wait blocks until every service is healthy or one of them fails, so
        # a broken migration or a container that dies on boot fails here rather
        # than in the step after it.
        run: docker compose up --build --wait --wait-timeout 180

      - name: The API answers, with the database behind it
        run: |
          set -e
          status=$(curl -s -o /tmp/ready.json -w "%{http_code}" http://localhost:3000/health/ready)
          cat /tmp/ready.json
          test "$status" = "200"

      - name: It is not running as root
        run: |
          set -e
          user=$(docker compose exec -T api whoami)
          echo "container user: $user"
          test "$user" != "root"

      - name: The migrations ran as their own step, and finished
        run: |
          set -e
          docker compose ps -a --format '{{.Service}} {{.State}}'
          test "$(docker compose ps -a --status exited --services)" = "migrate"

      - name: The image stayed small
        # Measured when this was written: 839 MB multi-stage, against 1.39 GB
        # for the same thing built in a single stage — the compiler, the type
        # definitions and the test runner are what that difference is made of.
        #
        # The ceiling is deliberately generous. It is a regression guard
        # against shipping the build tooling again, not a budget to optimise
        # against: most of what remains is Prisma's generated client and its
        # engines, which the API genuinely needs.
        run: |
          set -e
          bytes=$(docker image inspect farhand-api --format '{{.Size}}')
          echo "final image: $((bytes / 1000 / 1000)) MB"
          test "$bytes" -lt 1100000000

      - name: Logs, if anything went wrong
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Render
    # Only after both of the above are green, and only for master. A pull
    # request builds and tests; merging is what deploys.
    needs: [verify, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    # Never two deploys at once, and never cancel one halfway: a release that
    # is interrupted between "migrations applied" and "new version live" is
    # the one state nobody wants to debug.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    defaults:
      run:
        working-directory: farhand-api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: farhand-api/package-lock.json

      # The Prisma CLI for the next step, at exactly the version the lockfile
      # says, so CI migrates with the same Prisma the tests ran against.
      - name: Install dependencies
        run: npm ci

      - name: Run migrations against Neon
        # Render's free tier has no pre-deploy command, so this step is what
        # fly.toml's release_command used to be: if it fails, the job stops
        # here and Render is never asked to deploy (decision 0010).
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Checked before anything is deployed: without it, the wait below would
      # poll a URL with no host for ten minutes and fail without saying why.
      - name: The public URL is configured
        run: |
          if [ -z "$PUBLIC_URL" ]; then
            echo "PUBLIC_URL repository variable is not set — cannot tell when the deploy is live"
            exit 1
          fi
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}

      - name: Trigger the Render deploy
        run: |
          set -e
          # The hook URL already carries ?key=…, so ref is a second parameter.
          status=$(curl -s -o /tmp/deploy.json -w "%{http_code}" \
            "$RENDER_DEPLOY_HOOK_URL&ref=$GITHUB_SHA")
          cat /tmp/deploy.json
          # 202 means a deploy was already queued — ambiguous whether it is
          # THIS commit, so treated as a failure rather than assumed to be fine.
          test "$status" = "200"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      # The old version answers /health/ready happily for the whole length of
      # Render's build, so readiness alone proves nothing. The commit in
      # GET /health says which version is answering (docs/06-api-contract.md).
      - name: Wait for the new commit to go live
        run: |
          set -e
          for i in $(seq 1 60); do
            # `|| true`: while the service wakes or swaps, the answer may not
            # be JSON at all, and that is a reason to wait, not to fail.
            commit=$(curl -s "$PUBLIC_URL/health" | jq -r '.commit' 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "Live: $commit"
              break
            fi
            echo "Attempt $i: still $commit, waiting..."
            sleep 10
          done
          test "$commit" = "$GITHUB_SHA"
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}

      - name: Wait for readiness
        run: |
          set -e
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/health/ready" || true)
            if [ "$status" = "200" ]; then
              echo "Ready"
              break
            fi
            echo "Attempt $i: $status, waiting..."
            sleep 10
          done
          test "$status" = "200"
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
