# How Fly runs this API.
#
# Committed on purpose: it holds no secrets, only shape. Every secret —
# DATABASE_URL, SENTRY_DSN — is set with `fly secrets set` and lives in the
# platform, never here (docs/14-deployment.md).

# of the default URL, https://<app>.fly.dev, so pick something you are happy to
# put in the README.
app = "farhand-api-ksenia"

# Frankfurt — all a few milliseconds from Estonia. Put the database in the same
# one: a query crossing the Atlantic twice per request is the slowest thing an
# API can do to itself.
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Migrations as their own step, exactly as docker-compose.yml does it: Fly
  # runs this in a temporary machine, with the secrets, BEFORE any new machine
  # takes traffic. If it fails, the release stops and the old version carries
  # on serving (docs/09-environment.md).
  #
  # The binary directly rather than npx, for the reason in docker-compose.yml.
  release_command = "./node_modules/.bin/prisma migrate deploy"

  # Old machines keep serving until a new one passes its health check.
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  LOG_LEVEL = "info"

  APP_ORIGIN = "https://farhand-api-ksenia.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true

  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # The readiness endpoint, not the liveness one: this is the check that
  # decides whether a new version is allowed to take traffic, and a version
  # that cannot reach the database must not (#3).
  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
